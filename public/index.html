<!DOCTYPE html>
<html>
<head>
  <title>Masuk ke Room</title>
  <link rel="stylesheet" href="public/style.css">
</head>
<body>
  <div class="container">
    <h2>Masuk / Buat Room</h2>
    <input type="text" id="username" placeholder="Nama Anda">
    <input type="text" id="room" placeholder="Kode Room">
    <button onclick="createRoom()">Buat Room</button>
    <button onclick="joinRoom()">Masuk Room</button>
  </div>

  <script>
    async function createRoom() {
      const username = document.getElementById('username').value;
      const room = document.getElementById('room').value;
      if (!username || !room) return alert("Lengkapi data");
      await fetch('/api/createRoom', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ room })
      });
      localStorage.setItem('username', username);
      localStorage.setItem('room', room);
      window.location.href = 'chat.html';
    }

    function joinRoom() {
      const username = document.getElementById('username').value;
      const room = document.getElementById('room').value;
      if (!username || !room) return alert("Lengkapi data");
      localStorage.setItem('username', username);
      localStorage.setItem('room', room);
      window.location.href = 'chat.html';
    }
  </script>
</body>
</html>
